version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      # Temporary, for the first Dependabot-opened run of the Garnet Guard
      # workflow: ruff 0.17.3 (2026-10-27) may be proposed before its 7 days.
      # Remove once that run has been seen.
      exclude: ["ruff"]
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: deps
