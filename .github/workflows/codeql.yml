# CodeQL reads this repository's Python and its workflow files for common
# security bugs (unsafe file handling, injection into shell steps, tokens
# with more access than they need) and reports what it finds to code
# scanning. It runs on every pull request and push to main, so each merged
# change has been read by a static analysis tool, which is what the OpenSSF
# Scorecard SAST check looks for. Nothing it analyses is run: build-mode
# none reads the source without building or importing it.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
