# Fuzzing feeds the parsers that read hostile input (safe_archive, the
# JavaScript scanner and the lockfile parsers) millions of generated inputs
# and fails on any crash, hang or broken invariant (tests/fuzz/). Each pull
# request gets a short run, every night a longer one, and SPEC §13's
# release run (1 CPU-hour per parser) is a manual run with seconds: 3600.
name: Fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: true
        default: "3600"

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [jsscan, lockfiles, safe_archive]
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_DISPATCH: ${{ inputs.seconds }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked --group fuzz
      - name: Fuzz
        run: |
          case "$EVENT" in
            workflow_dispatch) seconds="$SECONDS_DISPATCH" ;;
            schedule) seconds=900 ;;
            *) seconds=60 ;;
          esac
          case "$seconds" in
            ''|*[!0-9]*) echo "::error::seconds must be a whole number"; exit 1 ;;
          esac
          mkdir -p "corpus/$TARGET" crashes
          uv run --locked --group fuzz python -m tests.fuzz.seeds "$TARGET" "corpus/$TARGET"
          uv run --locked --group fuzz python -m "tests.fuzz.fuzz_$TARGET" "corpus/$TARGET" \
            -max_total_time="$seconds" -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=crashes/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: crashes/
          if-no-files-found: ignore
          retention-days: 30
