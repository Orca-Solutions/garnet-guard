name: Release

# Publishes garnet-guard to PyPI when the maintainer pushes a version tag.
# Trusted Publishing (OIDC) replaces any stored token, and
# pypa/gh-action-pypi-publish signs PEP 740 attestations for every file.
# The same files, a Sigstore-signed build provenance for them and their
# SHA-256 sums then go on a draft GitHub release for the maintainer to publish.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Release tags must be cut from main."
            exit 1
          fi
      - name: Check the tag matches the project version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($version). Bump the version in a PR, merge it, then tag v$version."
            exit 1
          fi
      - run: uv build --no-sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    name: Sign build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # sign with Sigstore
      attestations: write # store the attestation on GitHub
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Name the bundle after the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir provenance
          cp "$BUNDLE" "provenance/garnet_guard-${TAG#v}.provenance.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/garnet-guard/
    permissions:
      id-token: write # Trusted Publishing and attestation signing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  verify:
    name: Verify attestations on PyPI
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: uv sync --locked
      - name: Verify each published file against this repository
        run: |
          for path in dist/*; do
            file="$(basename "$path")"
            ok=""
            for attempt in 1 2 3 4 5 6; do
              if uv run python -m pypi_attestations verify pypi \
                  --repository "https://github.com/$GITHUB_REPOSITORY" "pypi:$file"; then
                ok=1
                break
              fi
              echo "Attestation for $file not verifiable yet (attempt $attempt); retrying in 30s."
              sleep 30
            done
            if [ -z "$ok" ]; then
              echo "::error::Could not verify the PyPI attestation for $file."
              exit 1
            fi
          done

  github-release:
    name: Draft the GitHub release
    needs: [attest, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and attach its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance/
      - name: Create the draft release with the signed files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v head="## $version " 'index($0, head) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section headed '## $version (date)'."
            exit 1
          fi
          (cd dist && sha256sum -- *) > SHA256SUMS.txt
          files=(dist/* provenance/* SHA256SUMS.txt)
          prerelease=()
          case "$version" in *a*|*b*|*rc*) prerelease=(--prerelease) ;; esac
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$draft" in
            none)
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                "${prerelease[@]}" --title "Garnet Guard $version" --notes-file notes.md "${files[@]}"
              ;;
            true)
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
              ;;
            *)
              echo "::error::The GitHub release for $TAG is already published, and published releases are immutable, so its files can't be added. Delete it only if nothing links to it yet, then re-run this job."
              exit 1
              ;;
          esac
          echo "Draft release for $TAG is ready: open Releases, check the notes and publish it." >> "$GITHUB_STEP_SUMMARY"
