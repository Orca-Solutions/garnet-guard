# Real npm compromises replayed by `python -m backtest`.
#
# npm removes the tarball of a malicious version along with its registry
# record, so unlike the PyPI incidents the files can't be fetched. Each entry
# records what the registry showed for the bad version, from the public
# write-ups cited, and the baseline is fetched live. The tag lookup for the
# bad version runs live against the repository as it is today. Nothing is
# executed, and no malicious file is stored in this repository.
#
# Each record says: whether the registry listed provenance for the version
# (`attestation`), whether it was published through a trusted publisher
# (`trusted_publisher`), the install-time scripts in its package.json
# (`scripts`), and the source. What a write-up didn't report is recorded as
# unchanged from the baseline, so nothing is caught on guesswork. An entry
# that records `dependencies` (package.json's, as [name, range]) also records
# what the registry showed on the day about each new one
# (`dependency_profiles`), for GRN-C008. A profile's `owners` are left out
# when no source names the npm account, so nothing is softened on a guess.

[[incident]]
id = "chalk-5.6.1"
ecosystem = "npm"
package = "chalk"
baseline = "5.6.0"
candidate = "5.6.1"
source_repo = "chalk/chalk"
osv = "MAL-2025-47141"
uploaded_at = "2025-09-08T13:13:05+00:00"
attestation = false
scripts = []
summary = "Published from the maintainer's phished npm account on 2025-09-08; index.js gained an obfuscated line that hijacks crypto transactions in browsers. The package had never used provenance."
sources = [
  "https://github.com/chalk/chalk/issues/656",
  "https://semgrep.dev/blog/2025/chalk-debug-and-color-on-npm-compromised-in-new-supply-chain-attack",
]
note = "replayed: version removed from npm; registry facts recorded from write-ups, tarball not inspected"

