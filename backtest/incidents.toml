# Real compromises replayed by `python -m backtest`.
#
# The malicious versions are no longer listed on PyPI, but the files are still
# served by files.pythonhosted.org. Unless an entry says otherwise, URLs,
# SHA-256 and upload times come from the PyPI JSON snapshot taken when the
# release was found, in DataDog's malicious-software-packages-dataset
# (samples/pypi/compromised_lib). litellm 1.82.7/1.82.8 have no snapshot: their
# URLs come from PyPI Inspector links in PYSEC-2026-2, their SHA-256 match the
# litellm-pwn-detect hash table, and their upload times come from the
# advisories, to the minute. Entries without `uploaded_at` have no snapshot:
# their filenames, SHA-256 and BLAKE2b come from the `package_integrity`
# records of the OSV advisory named on the entry (ossf/malicious-packages),
# and the upload day comes from the advisory and the wheel's own timestamps.
# A files.pythonhosted.org path is the file's BLAKE2b-256, and every file here
# hashes to its path. Garnet checks every download against the SHA-256 before
# reading it. Nothing is executed.
#
# tags_on_the_day records git tags that changed between the upload and today,
# with the evidence: `sha` restores a tag deleted since, `absent = true` hides
# a tag pushed later. The replay uses the tags as they stood on the day. Tag
# changes nobody recorded are not modelled.
#
# PyPI no longer serves provenance for a removed release, so attestation rules
# can't be replayed. `attested = false` records, with `attested_evidence`, a
# release that public sources confirm had no attestations.

