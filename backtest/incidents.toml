# Real compromises replayed by `python -m backtest`.
#
# The malicious versions are no longer listed on PyPI, but the files are still
# served by files.pythonhosted.org. For lightning and elementary-data, URLs and
# SHA-256 come from the PyPI JSON snapshot in DataDog's
# malicious-software-packages-dataset. For litellm and telnyx, URLs come from
# PyPI Inspector links in the OSV advisories and from SafeDep's write-up; a
# files.pythonhosted.org path is the file's BLAKE2b-256, and every file here
# hashes to its path. Their SHA-256 match the advisories (litellm: the
# litellm-pwn-detect hash table; telnyx: GHSA-955r-262c-33jc and StepSecurity).
# Garnet checks every download against the hash before reading it. Nothing is
# executed.
#
# tags_on_the_day records git tags that changed between the upload and today,
# with the evidence: `sha` restores a tag deleted since, `absent = true` hides
# a tag pushed later. The replay uses the tags as they stood on the day.

