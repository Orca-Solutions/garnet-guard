# Garnet Guard comment job for the two-workflow pattern (SPEC §10.2).
#
# The pull_request workflow checks the dependencies with comment: false and
# uploads its JSON report as the garnet-guard-report artifact. This action runs
# in a separate workflow on workflow_run, where the token can write comments.
# It never checks out or runs pull request code, ignores everything in the
# artifact except the JSON report, renders the comment itself, and finds the
# pull request from the workflow_run event rather than from the artifact.
name: Garnet Guard comment
description: Posts the Garnet Guard report from a pull_request run as a pull request comment.
author: Garnet contributors

inputs:
  footer:
    description: End the comment with a line linking to Garnet Guard's rule docs. Set to false to remove it.
    default: "true"
  artifact:
    description: Name of the artifact holding report.json.
    default: garnet-guard-report
  github-token:
    description: Token with pull-requests write and actions read. The default is the workflow's GITHUB_TOKEN.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Find the pull request
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/find-pr.sh"

    - name: Download the report
      if: ${{ steps.pr.outputs.number != '' }}
      # A missing report becomes a "couldn't check" comment in the next step.
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ runner.temp }}/garnet-guard-artifact

    - name: Set up uv
      if: ${{ steps.pr.outputs.number != '' }}
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.11.32"
        working-directory: ${{ github.action_path }}/../..
        enable-cache: "false"

    - name: Render the comment
      id: render
      if: ${{ steps.pr.outputs.number != '' }}
      shell: bash
      env:
        GARNET_ROOT: ${{ github.action_path }}/../..
        GARNET_FOOTER: ${{ inputs.footer }}
      run: bash "$GITHUB_ACTION_PATH/render.sh"

    - name: Post the pull request comment
      if: ${{ steps.pr.outputs.number != '' }}
      shell: bash
      env:
        GARNET_ROOT: ${{ github.action_path }}/../..
        GARNET_COMMENT: ${{ steps.render.outputs.comment-path }}
        GARNET_PR: ${{ steps.pr.outputs.number }}
        GARNET_UPDATE_ONLY: ${{ steps.render.outputs.no-changes }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GARNET_ROOT/action/post-comment.sh"
